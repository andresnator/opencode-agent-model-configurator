name: Bug report
description: Report a reproducible, non-security plugin problem
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for public, non-security bugs.
        **Do not post secrets or vulnerability details.** Report vulnerabilities through [GitHub Private Vulnerability Reporting](https://github.com/andresnator/opencode-agent-model-configurator/security/advisories/new).

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version or revision
      description: Enter the tag or commit SHA loaded by OpenCode.
      placeholder: vX.Y.Z or a full commit SHA
    validations:
      required: true

  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: Enter the exact OpenCode version.
      placeholder: 1.18.10
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, CPU architecture, shell, Node.js version, and project or global scope.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the shortest sequence that always shows the problem.
      placeholder: |
        1. Start with ...
        2. Open ...
        3. Select ...
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual result
      description: What happened instead? Include the exact visible error when relevant.
    validations:
      required: true

  - type: textarea
    id: sanitized-logs
    attributes:
      label: Sanitized logs or output
      description: Paste the smallest useful excerpt. Remove tokens, credentials, user names, private paths, and private repository data. Write `None` when unavailable.
    validations:
      required: true
