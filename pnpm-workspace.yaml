packages:
  - .

overrides:
  '@babel/core': 7.29.7
  'brace-expansion@2': 2.1.7
  seroval: 1.6.3

auditLevel: low
minimumReleaseAge: 1440
# Target the exact OpenCode release already installed; retain the age gate for other versions.
minimumReleaseAgeExclude:
  - '@opencode/ai@2.0.28'
  - '@opencode/client@2.0.28'
  - '@opencode/plugin@2.0.28'
  - '@opencode/protocol@2.0.28'
  - '@opencode/schema@2.0.28'
  - '@opencode/theme@2.0.28'
  - '@opencode/util@2.0.28'
trustPolicy: no-downgrade
# These exact versions pass npm's registry-signature audit but cannot be
# compared reliably by pnpm's trust-history policy.
trustPolicyExclude:
  - effect@4.0.0-beta.83
  - semver@6.3.1
blockExoticSubdeps: true
strictDepBuilds: true
# esbuild's platform installer is required; optional native accelerators are
# deliberately blocked because this repository does not need them.
allowBuilds:
  esbuild@0.28.2: true
  msgpackr-extract@3.0.4: false
  fsevents@2.3.3: false
packageManagerStrict: true
packageManagerStrictVersion: true
verifyDepsBeforeRun: error
engineStrict: true
nodeVersion: 26.4.0
